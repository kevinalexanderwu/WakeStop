name: wakestop
description: WakeStop - Transit Alarm App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^16.0.0

  # Fonts
  google_fonts: ^6.3.0

  # SVG
  flutter_svg: ^2.2.0

  # Utility
  equatable: ^2.0.7
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # Map
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

  flutter_local_notifications: ^19.4.0
  just_audio: ^0.10.4
  http: ^1.5.0

  google_maps_flutter: ^2.13.1

  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/data/
    - assets/sounds/